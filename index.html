<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>坂木茜音 | Akane Sakaki</title><style>
:root{--ink:#17191b;--muted:#666b70;--line:#e9e9e6;--soft:#f7f7f4;--shadow:0 5px 18px rgba(28,32,36,.1);--radius:16px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",Meiryo,sans-serif;line-height:1.75;letter-spacing:.015em}button,a{font:inherit}a{color:inherit}.page{width:min(100% - 40px,850px);margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 344px;gap:48px;align-items:start}.profile{position:sticky;top:0;min-height:100vh;padding:48px 0 32px;display:flex;flex-direction:column}.profile-top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.avatar{width:140px;aspect-ratio:1;border-radius:50%;object-fit:cover}.contact-btn,.create-btn,.ghost-btn{border:1px solid #d4d7d6;border-radius:8px;background:#fff;cursor:pointer;transition:.18s}.contact-btn{padding:7px 14px;font-weight:650;font-size:14px}.contact-btn:hover,.ghost-btn:hover{background:var(--soft);transform:translateY(-1px)}.tagline{margin:0;font-size:19px;font-weight:750}h1{margin:2px 0 0;font-size:40px;line-height:1.3;letter-spacing:.04em}.latin{margin:-1px 0 18px;color:#414548}.intro{font-size:17px;line-height:1.72}.intro p{margin:0 0 10px}.intro .muted{color:#62676b;margin-top:15px}.brand{width:94px;margin:47px auto 0}.profile-actions{margin-top:auto;padding-top:54px}.create-btn{display:block;width:100%;padding:10px 18px;font-weight:750;font-size:18px;box-shadow:0 2px 10px #00000014;text-align:center;text-decoration:none}.feed{padding:51px 0 72px}.card{overflow:hidden;margin:0 0 24px;border-radius:var(--radius);background:#fff;box-shadow:var(--shadow)}.card img{width:100%;max-height:290px;display:block;object-fit:cover;background:#eee}.card-body{padding:20px 22px 22px}.card h2{margin:0 0 7px;font-size:16px;line-height:1.55}.card p{margin:0;font-size:14px;line-height:1.7}.more-panel{margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}.more-panel[hidden]{display:none}.more-panel h2{margin:23px 0 12px;font-size:20px}.history{list-style:none;padding:0;margin:0}.history li{padding:13px 0;border-bottom:1px solid var(--line)}.history strong,.history span{display:block}.history span{color:var(--muted);font-size:13px}.ghost-btn{width:100%;padding:8px 15px;margin-top:15px;font-weight:700}.scrim{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#1013146b;backdrop-filter:blur(5px)}.scrim[hidden]{display:none}.dialog{width:min(100%,410px);border-radius:18px;background:#fff;padding:25px;box-shadow:0 20px 70px #0004}.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog h2{margin:0}.close{border:0;background:transparent;font-size:25px;cursor:pointer}.contact-list{margin:18px 0 0;padding:0;list-style:none}.contact-list li{padding:12px 0;border-top:1px solid var(--line)}.contact-list small{display:block;color:var(--muted)}.copy{float:right;border:0;border-radius:6px;padding:4px 8px;cursor:pointer;background:var(--soft)}.mobile-bar{display:none}
@media(max-width:760px){.page{width:min(100% - 34px,520px);display:block}.profile{position:static;min-height:auto;padding:28px 0 8px}.profile-top{align-items:flex-end}.avatar{width:112px}.tagline{font-size:17px}h1{font-size:34px}.intro{font-size:16px}.brand{margin-top:35px}.profile-actions{display:none}.feed{padding:28px 0 95px}.card{margin-bottom:20px}.mobile-bar{position:fixed;z-index:10;left:0;right:0;bottom:0;display:flex;gap:10px;padding:11px 16px calc(11px + env(safe-area-inset-bottom));background:#fffffff0;border-top:1px solid var(--line);backdrop-filter:blur(12px)}.mobile-bar button,.mobile-bar a{flex:1;padding:10px;text-align:center;text-decoration:none;font-weight:750;border-radius:8px;border:1px solid #d4d7d6;background:#fff}}
</style></head><body><main class="page"><section class="profile" aria-labelledby="profile-name">
<div class="profile-top"><img class="avatar" id="avatar" src="" alt=""><button class="contact-btn" data-open>▣ 名刺情報の表示</button></div>
<p class="tagline" id="tagline"></p><h1 id="profile-name"></h1><p class="latin" id="name-latin"></p><div class="intro" id="intro"></div>
<p id="load-error" hidden>プロフィールを読み込めませんでした。ページを再読み込みしてください。</p>
<button class="ghost-btn" id="moreButton" aria-expanded="false">More</button><section class="more-panel" id="morePanel" hidden></section>
<img class="brand" id="brand" src="" alt=""><div class="profile-actions"><a class="create-btn" data-create-page href="#" target="_blank" rel="noopener">プロフィールページを作る</a></div></section>
<section class="feed" id="feed" aria-label="プロフィールコンテンツ"></section></main>
<div class="mobile-bar"><button data-open>名刺情報</button><a data-create-page href="#" target="_blank" rel="noopener">ページを作る</a></div><div class="scrim" id="dialog" role="dialog" aria-modal="true" hidden><div class="dialog"><div class="dialog-head"><h2>名刺情報</h2><button class="close" aria-label="閉じる">×</button></div><ul class="contact-list"><li><small>名前</small><strong id="contact-name"></strong></li><li><small>メール</small><button class="copy" data-copy="email">コピー</button><a id="contact-email" href="#"></a></li><li><small>電話</small><button class="copy" data-copy="phone">コピー</button><a id="contact-phone" href="#"></a></li><li><small>Web</small><a id="contact-website" href="#"></a></li><li><small>所在地</small><span id="contact-location"></span></li></ul></div></div>
<script src="content.js"></script></body></html>
